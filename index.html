<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No user-scalable=no / maximum-scale=1: pinch-zoom is how someone reads a
         transaction row on a phone at the front desk, and blocking it fails
         WCAG 1.4.4. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040D1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Security headers are served by vercel.json (production) and by
         vite.config.js (dev/preview), which is the only place they can be set
         for non-HTML responses. They are deliberately NOT duplicated here as
         <meta http-equiv>: when a document carries both a CSP header and a CSP
         meta tag, the browser enforces the intersection of the two, so a meta
         tag can only ever narrow the policy — never widen it. The meta CSP that
         used to live here allowed blob: while the header did not, which is
         exactly the case where the intersection wins and the wider-looking meta
         tag is a decoy. X-Frame-Options and Permissions-Policy are ignored
         entirely when set via meta. -->
    <title>Red Roof Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
