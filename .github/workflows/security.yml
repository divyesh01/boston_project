name: Security and Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Was '20', which made the "Run Tests" step below fail on EVERY run from
          # 2026-08-13 to 2026-08-24 while looking like a code problem. jsdom@30
          # declares `^22.22.2 || ^24.15.0 || >=26.0.0` and loads undici@8
          # (`>=22.19.0`); on Node 20 undici's `webidl.util.markAsUncloneable` does
          # not exist, so `new CacheStorage` throws at import, all 36 test files
          # fail to START, and vitest reports "no tests" + 36 unhandled errors with
          # exit 1. Zero tests had ever executed in CI. Reproduced on node 20.20.2.
          #
          # Do NOT "simplify" this to a floating range or `node-version-file`.
          # jsdom and nanoid deliberately exclude the odd, non-LTS majors: measured
          # against all 428 `engines.node` declarations in package-lock.json,
          # 22.22.2 / 24.15.0 / 26.0.0 satisfy every one, while 20.20.2 violates 8,
          # 23.11.1 violates 11 and 25.5.0 violates 2. A range that resolves to
          # "newest satisfying" would land on 25.x and break jsdom again.
          # Kept in lockstep with package.json `engines` by
          # scripts/probe-ci-node-version.mjs.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        # Must be `npm run typecheck`, never a bare `npx tsc --noEmit`. There is
        # no root tsconfig.json in this repo — only jsconfig.json — so bare tsc
        # finds no input files, prints its help text and exits 1. That looks like
        # a type error but checks nothing; it failed this job in 0s on 2026-08-21.
        # Calling the npm script keeps CI and the local gate on one command
        # (`tsc -p ./jsconfig.json`) so they cannot drift apart again.
        run: npm run typecheck

      - name: Verify Repo Map
        # ADDED 2026-09-05. Both documentation gates lived ONLY in
        # .git/hooks/pre-commit, and .git/ is not in the repository, so the hook is
        # untracked by construction: it runs for whoever happens to have the file
        # and for nobody else. `git config core.hooksPath` is unset and there is no
        # .husky/ — so before this step, a clone that never installed the hook had
        # no doc gate at all, and CI had none on any run. .githooks/pre-commit is
        # now tracked; `git config core.hooksPath .githooks` installs it.
        #
        # This step is deliberately map:verify ALONE. brain:verify does not belong
        # in CI and adding it would be worse than leaving it out: its only input is
        # `execSync('git diff --cached --name-only')` at scripts/verify-brain.mjs:4,
        # and CI stages nothing, so it would read no files, check no citations and
        # exit 0 on every run forever — a gate that cannot fail is indistinguishable
        # from a gate that is working, which is the exact shape of green this
        # repository's audits exist to remove. Fixing its input selection (diff
        # against the merge base instead of the index) is a real change, tracked in
        # docs/brain/BRAIN_TROUBLESHOOTING.md section 52, not a CI edit.
        #
        # verify-repo-map.mjs compares docs/*.md against the actual tree and never
        # consults the index — measured 0 occurrences of `diff --cached` — so it
        # reports the same thing in CI as it does locally: `10 areas, 27 matrix
        # rows, 36 contracts, 186 references resolved, 0 problems` at this commit.
        run: npm run map:verify

      - name: Run Tests
        run: npm test

      - name: Security Vulnerability Audit
        # Was `npm audit --audit-level=high`, which cannot pass while `xlsx`
        # carries two high advisories that SheetJS publishes no npm fix for — it
        # made this job unpassable regardless of code quality. The gate now
        # accepts those two advisories BY ID with a written reachability
        # argument, and still fails on anything else, on a stale exception, and
        # on its own inability to run. Never swap this back for
        # `--audit-level=critical` or `continue-on-error`.
        run: npm run audit:gate

      - name: Verify Production Build
        run: npm run build
        env:
          NODE_ENV: production
          # This step verifies the SHIPPED shape, so it must build the same one the
          # deploy builds: standalone (in-browser auth behind an identity proxy).
          # Since 2026-08-24 .env.production is committed, so the checkout already
          # carries both flags and envGuardPlugin.js stays quiet. These two lines
          # are belt-and-braces, not decoration: they keep this step honest if that
          # file is ever renamed, emptied or re-gitignored, and they state the
          # required shape where a reader of this workflow will actually see it.
          # Asserted by scripts/probe-standalone-deploy.mjs section 6.
          VITE_USE_SERVER_AUTH: 'true'
          VITE_USE_D1_API: 'false'
